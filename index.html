<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTech Academy - Gerenciamento de Alunos</title>
</head>
<body>
  <h1>DevTech Academy - Gerenciamento de Alunos</h1>

  <h2 id="titulo-form">Cadastrar aluno</h2>
  <form id="form-aluno">
    <label>Nome: <input type="text" id="nome" required maxlength="60" pattern="\p{L}[\p{L}' .\-]*" title="Use apenas letras, espaços, apóstrofo, hífen ou ponto (sem números)"></label><br><br>
    <label>Idade: <input type="number" id="idade" min="1" max="120" required></label><br><br>
    <label>Curso:
      <select id="curso" required>
        <option value="JavaScript">JavaScript</option>
        <option value="Python">Python</option>
        <option value="Java">Java</option>
      </select>
    </label><br><br>
    <label>Nota Final: <input type="number" id="nota" min="0" max="10" step="0.1" required></label><br><br>
    <button type="submit" id="btn-salvar">Cadastrar</button>
    <button type="button" id="btn-cancelar" hidden>Cancelar edição</button>
  </form>

  <h2>Alunos cadastrados</h2>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Idade</th>
        <th>Curso</th>
        <th>Nota Final</th>
        <th>Situação</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-alunos"></tbody>
  </table>

  <h2>Relatórios</h2>
  <button type="button" id="btn-aprovados">Alunos aprovados</button>
  <button type="button" id="btn-media-notas">Média das notas</button>
  <button type="button" id="btn-media-idades">Média das idades</button>
  <button type="button" id="btn-alfabetica">Nomes em ordem alfabética</button>
  <button type="button" id="btn-por-curso">Alunos por curso</button>

  <div id="resultado"></div>

  <script src="Aluno.js"></script>
  <script src="script.js"></script>
</body>
</html>
